{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>My Django Blog</title>
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
</head>
<body>

    <h1>My Blog</h1>

    {% for post in posts %}
        <div class="post">
            <h2>
                <a href="{% url 'post_detail' post.id %}">
                    {{ post.title }}
                </a>
            </h2>
            <p>{{ post.content|truncatewords:20 }}</p>
        </div>
    {% empty %}
        <p>No posts yet.</p>
    {% endfor %}

</body>
</html>
